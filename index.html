<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Experiencia AR</title>
    <!-- Librerías base -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <script>
      // Componente Chroma Key robusto con espacio YCbCr
      AFRAME.registerComponent('chromakey-directo', {
        schema: {
          src: { type: 'selector' },
          similarity: { type: 'number', default: 0.40 }, // Tolerancia (ajusta si quedan restos de verde)
          smoothness: { type: 'number', default: 0.10 }  // Suavizado del borde
        },
        init: function () {
          this.videoEl = this.data.src;
          this.texture = new THREE.VideoTexture(this.videoEl);
          this.texture.minFilter = THREE.LinearFilter;
          this.texture.magFilter = THREE.LinearFilter;
          this.texture.format = THREE.RGBAFormat;

          // Color verde #04F404 en RGB normalizado
          const keyColor = new THREE.Color('#04f404');

          this.material = new THREE.ShaderMaterial({
            uniforms: {
              uTexture: { value: this.texture },
              uKeyColor: { value: keyColor },
              uSimilarity: { value: this.data.similarity },
              uSmoothness: { value: this.data.smoothness }
            },
            vertexShader: `
              varying vec2 vUv;
              void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }
            `,
            fragmentShader: `
              uniform sampler2D uTexture;
              uniform vec3 uKeyColor;
              uniform float uSimilarity;
              uniform float uSmoothness;
              varying vec2 vUv;

              // Conversión precisa a espacio YCbCr para separación croma
              vec2 RGBtoUV(vec3 rgb) {
                return vec2(
                  -0.168736 * rgb.r - 0.331264 * rgb.g + 0.5 * rgb.b,
                   0.5 * rgb.r - 0.418688 * rgb.g - 0.081312 * rgb.b
                );
              }

              void main() {
                vec4 texColor = texture2D(uTexture, vUv);
                
                vec2 targetUV = RGBtoUV(uKeyColor);
                vec2 currentUV = RGBtoUV(texColor.rgb);
                
                float dist = distance(targetUV, currentUV);
                float mask = smoothstep(uSimilarity, uSimilarity + uSmoothness, dist);

                // Corrección de despill: quita el rebote verde en los bordes
                vec3 finalColor = texColor.rgb;
                if (dist < uSimilarity + uSmoothness) {
                  float maxNonGreen = max(finalColor.r, finalColor.b);
                  finalColor.g = min(finalColor.g, maxNonGreen);
                }

                gl_FragColor = vec4(finalColor, texColor.a * mask);
              }
            `,
            transparent: true,
            side: THREE.DoubleSide
          });

          // Asegurar aplicación cuando la geometría esté lista
          const mesh = this.el.getObject3D('mesh');
          if (mesh) {
            mesh.material = this.material;
          } else {
            this.el.addEventListener('loaded', () => {
              this.el.getObject3D('mesh').material = this.material;
            });
          }
        },
        tick: function () {
          // Forzar refresco del fotograma en WebGL en cada ciclo de render
          if (this.texture) {
            this.texture.needsUpdate = true;
          }
        }
      });
    </script>

    <style>
      body { margin: 0; overflow: hidden; }
      #pantalla-inicio {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background-color: rgba(0, 0, 0, 0.88); z-index: 9999;
        display: flex; flex-direction: column; justify-content: center;
        align-items: center; color: #ffffff; font-family: sans-serif;
        text-align: center; padding: 24px; box-sizing: border-box;
      }
      #btn-iniciar {
        margin-top: 24px; padding: 16px 36px; font-size: 18px; font-weight: bold;
        background-color: #00e676; color: #000000; border: none; border-radius: 50px; cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div id="pantalla-inicio">
      <h2 style="margin: 0 0 12px 0;">Experiencia Interactiva</h2>
      <p style="margin: 0; max-width: 320px; line-height: 1.5;">
        Presiona el botón para activar la cámara y el sonido, luego apunta al afiche.
      </p>
      <button id="btn-iniciar">Iniciar experiencia</button>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights, alpha: true" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video 
          id="video-avatar" 
          src="./avatar1.mp4" 
          preload="auto" 
          loop="true" 
          crossorigin="anonymous" 
          playsinline 
          webkit-playsinline>
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Plano que ejecuta el shader chromakey-directo -->
        <a-plane 
          position="0 0 0" 
          height="1.2" 
          width="0.68" 
          chromakey-directo="src: #video-avatar; similarity: 0.40; smoothness: 0.10;">
        </a-plane>
      </a-entity>
    </a-scene>

    <script>
      const pantallaInicio = document.querySelector('#pantalla-inicio');
      const btnIniciar = document.querySelector('#btn-iniciar');
      const video = document.querySelector('#video-avatar');
      const target = document.querySelector('[mindar-image-target]');

      btnIniciar.addEventListener('click', () => {
        pantallaInicio.style.display = 'none';
        video.play();
        video.pause();
      });

      target.addEventListener('targetFound', () => {
        video.play();
      });

      target.addEventListener('targetLost', () => {
        video.pause();
      });
    </script>
  </body>
</html>
