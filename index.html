<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Experiencia AR</title>
    <!-- Librerías Three.js, A-Frame y MindAR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <!-- Shader estricto de croma (elimina únicamente verde #04F404) -->
    <script>
      AFRAME.registerComponent('chromakey', {
        init: function () {
          const videoElement = document.querySelector('#video-avatar');
          const texture = new THREE.VideoTexture(videoElement);
          texture.minFilter = THREE.LinearFilter;
          texture.magFilter = THREE.LinearFilter;

          this.material = new THREE.ShaderMaterial({
            uniforms: {
              textureMap: { value: texture }
            },
            vertexShader: `
              varying vec2 vUv;
              void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }
            `,
            fragmentShader: `
              uniform sampler2D textureMap;
              varying vec2 vUv;

              void main() {
                vec4 pixel = texture2D(textureMap, vUv);
                float r = pixel.r;
                float g = pixel.g;
                float b = pixel.b;

                // Aislamiento estricto de verde #04F404
                float maxOtros = max(r, b);
                float diferenciaVerde = g - maxOtros;

                // Solo descarta el verde puro del fondo
                if (g > 0.45 && diferenciaVerde > 0.18) {
                  discard;
                } else {
                  if (diferenciaVerde > 0.05) {
                    g = maxOtros;
                  }
                  gl_FragColor = vec4(r, g, b, pixel.a);
                }
              }
            `,
            transparent: true,
            side: THREE.DoubleSide
          });

          const mesh = this.el.getObject3D('mesh');
          if (mesh) {
            mesh.material = this.material;
          } else {
            this.el.addEventListener('loaded', () => {
              this.el.getObject3D('mesh').material = this.material;
            });
          }
        }
      });
    </script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      
      /* Pantalla inicial para desbloquear el AudioContext del navegador */
      #pantalla-inicio {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.92);
        z-index: 999999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }

      #btn-iniciar {
        margin-top: 24px;
        padding: 16px 36px;
        font-size: 18px;
        font-weight: bold;
        background-color: #f7b731;
        color: #000000;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(247, 183, 49, 0.4);
      }

      /* Contenedor flotante permanente para la UI móvil */
      #ui-ar-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 900000;
        pointer-events: none; /* Deja pasar los eventos táctiles excepto en sus botones */
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        padding-bottom: 40px;
        box-sizing: border-box;
      }

      /* Botón del Marley Club con visibilidad garantizada */
      #btn-marley-club {
        display: none; /* Controlado por script al finalizar */
        pointer-events: auto; /* Activa la interacción táctil directa */
        width: 85%;
        max-width: 320px;
        padding: 18px 20px;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        background-color: #f7b731;
        color: #111111;
        text-align: center;
        text-decoration: none;
        border-radius: 50px;
        border: 2px solid #ffffff;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        box-sizing: border-box;
        animation: pulseBtn 1.8s infinite;
      }

      @keyframes pulseBtn {
        0% { transform: scale(1); }
        50% { transform: scale(1.03); }
        100% { transform: scale(1); }
      }
    </style>
  </head>

  <body>
    <!-- Capa de inicio -->
    <div id="pantalla-inicio">
      <h2 style="margin: 0 0 12px 0;">Experiencia Interactiva</h2>
      <p style="margin: 0; max-width: 320px; line-height: 1.5;">
        Toca el botón para activar la cámara y el audio, luego apunta hacia el afiche.
      </p>
      <button id="btn-iniciar">Iniciar experiencia</button>
    </div>

    <!-- Capa UI superpuesta a la escena 3D -->
    <div id="ui-ar-container">
      <a id="btn-marley-club" href="https://marleycoffee.cl" target="_blank" rel="noopener noreferrer">
        Únete al Marley Club
      </a>
    </div>

    <!-- Escena AR -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video 
          id="video-avatar" 
          src="./avatar1.mp4" 
          preload="auto" 
          crossorigin="anonymous" 
          playsinline 
          webkit-playsinline>
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Escala controlada (1.35x): sobresale un poco del marco sin desbordar en exceso -->
        <a-plane 
          id="plano-avatar"
          chromakey
          position="0 0.05 0.05" 
          height="1.77" 
          width="1.0"
          scale="1.35 1.35 1.35">
        </a-plane>
      </a-entity>
    </a-scene>

    <script>
      const pantallaInicio = document.querySelector('#pantalla-inicio');
      const btnIniciar = document.querySelector('#btn-iniciar');
      const video = document.querySelector('#video-avatar');
      const target = document.querySelector('[mindar-image-target]');
      const btnMarley = document.querySelector('#btn-marley-club');

      let experienciaIniciada = false;
      let finalizado = false;

      // 1. Desbloqueo seguro de MediaContext al tocar el botón inicial
      btnIniciar.addEventListener('click', () => {
        pantallaInicio.style.display = 'none';
        experienciaIniciada = true;

        video.play().then(() => {
          video.pause();
          video.currentTime = 0;
        }).catch((err) => {
          console.warn("Autoplay bloqueado temporalmente:", err);
        });
      });

      // 2. Control de reproducción basado en el tracking de MindAR
      target.addEventListener('targetFound', () => {
        if (experienciaIniciada && !finalizado) {
          video.play().catch(e => console.error(e));
        }
      });

      target.addEventListener('targetLost', () => {
        if (!finalizado) {
          video.pause();
        }
      });

      // 3. Función canónica de detención definitiva y activación de CTA
      function terminarVideoYMostrarCTA() {
        if (finalizado) return;
        finalizado = true;

        // Detener reproducción completamente
        video.pause();
        video.currentTime = video.duration || video.currentTime;
        video.loop = false;

        // Desplegar botón sobre la interfaz
        btnMarley.style.display = 'block';
      }

      // Vía A: Evento nativo estándar HTML5
      video.addEventListener('ended', terminarVideoYMostrarCTA);

      // Vía B: Monitor activo para navegadores móviles donde 'ended' falla
      video.addEventListener('timeupdate', () => {
        if (!finalizado && video.duration > 0) {
          // Si el cabezal llega a los últimos 150 milisegundos, ejecuta el corte
          if (video.currentTime >= video.duration - 0.15) {
            terminarVideoYMostrarCTA();
          }
        }
      });

      // Redirección táctil directa para evitar bloqueos del navegador en móviles
      btnMarley.addEventListener('click', (e) => {
        e.preventDefault();
        window.location.href = 'https://marleycoffee.cl';
      });
    </script>
  </body>
</html>
