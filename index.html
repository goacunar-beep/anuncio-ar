<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Experiencia AR</title>
    <!-- Librerías de realidad aumentada -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <script>
      // Componente que elimina EXCLUSIVAMENTE el fondo verde #04F404
      AFRAME.registerComponent('quitar-solo-verde', {
        schema: {
          src: { type: 'selector' }
        },
        init: function () {
          this.videoEl = this.data.src;
          this.texture = new THREE.VideoTexture(this.videoEl);
          this.texture.minFilter = THREE.LinearFilter;
          this.texture.magFilter = THREE.LinearFilter;
          this.texture.format = THREE.RGBAFormat;

          this.material = new THREE.ShaderMaterial({
            uniforms: {
              uTexture: { value: this.texture }
            },
            vertexShader: `
              varying vec2 vUv;
              void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }
            `,
            fragmentShader: `
              uniform sampler2D uTexture;
              varying vec2 vUv;

              void main() {
                vec4 pixel = texture2D(uTexture, vUv);

                // Regla estricta:
                // El verde (#04F404) tiene verde alto (> 0.55) y rojo/azul muy bajos (< 0.35)
                // Cualquier ropa negra, piel o café tiene rojo o azul más presentes
                bool esFondoVerde = (pixel.g > 0.55) && (pixel.r < 0.35) && (pixel.b < 0.35);

                if (esFondoVerde) {
                  discard; // Elimina por completo el píxel (transparencia total)
                } else {
                  gl_FragColor = pixel; // Mantiene el avatar y los granos intactos
                }
              }
            `,
            transparent: true,
            side: THREE.DoubleSide
          });

          const aplicarMaterial = () => {
            const mesh = this.el.getObject3D('mesh');
            if (mesh) {
              mesh.material = this.material;
            }
          };

          if (this.el.getObject3D('mesh')) {
            aplicarMaterial();
          } else {
            this.el.addEventListener('loaded', aplicarMaterial);
          }
        },
        tick: function () {
          if (this.texture) {
            this.texture.needsUpdate = true;
          }
        }
      });
    </script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #pantalla-inicio {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.88);
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #ffffff;
        font-family: sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      #btn-iniciar {
