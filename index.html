<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Experiencia AR</title>
    <!-- Librerías A-Frame y MindAR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <!-- Shader de croma para fondo #04f404 -->
    <script>
      AFRAME.registerComponent('chromakey', {
        schema: {
          color: { type: 'color', default: '#04f404' },
          similarity: { type: 'number', default: 0.75 },
          smoothness: { type: 'number', default: 0.1 }
        },
        init: function () {
          const videoEl = document.querySelector(this.el.getAttribute('src'));
          const texture = new THREE.VideoTexture(videoEl);
          texture.minFilter = THREE.LinearFilter;
          texture.magFilter = THREE.LinearFilter;
          texture.format = THREE.RGBAFormat;

          const keyColor = new THREE.Color(this.data.color);

          const material = new THREE.ShaderMaterial({
            transparent: true,
            uniforms: {
              uTexture: { value: texture },
              uKeyColor: { value: new THREE.Vector3(keyColor.r, keyColor.g, keyColor.b) },
              uSimilarity: { value: this.data.similarity },
              uSmoothness: { value: this.data.smoothness }
            },
            vertexShader: `
              varying vec2 vUv;
              void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }
            `,
            fragmentShader: `
              uniform sampler2D uTexture;
              uniform vec3 uKeyColor;
              uniform float uSimilarity;
              uniform float uSmoothness;
              varying vec2 vUv;

              void main() {
                vec4 videoColor = texture2D(uTexture, vUv);
                float dist = distance(videoColor.rgb, uKeyColor);
                float edge = smoothstep(uSimilarity, uSimilarity + uSmoothness, dist);
                gl_FragColor = vec4(videoColor.rgb, videoColor.a * edge);
              }
            `
          });

          this.el.getObject3D('mesh').material = material;
        }
      });
    </script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      /* Pantalla inicial para permitir audio */
      #pantalla-inicio {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.88);
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #ffffff;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      #btn-iniciar {
        margin-top: 24px;
        padding: 16px 36px;
        font-size: 18px;
        font-weight: bold;
        background-color: #00e676;
        color: #000000;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(0, 230, 118, 0.4);
      }

      /* Botón final (Llamado a la acción) */
      #contenedor-cta {
        display: none; /* Oculto hasta que termine el video */
        position: fixed;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9998;
        width: 90%;
        max-width: 360px;
        text-align: center;
        animation: fadeIn 0.5s ease-in-out;
      }

      #btn-marley {
        display: block;
        padding: 18px 24px;
        font-size: 18px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-decoration: none;
        color: #111111;
        background: linear-gradient(135deg, #ffd700, #ffae00);
        border: 2px solid #ffffff;
        border-radius: 50px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translate(-50%, 20px); }
        to { opacity: 1; transform: translate(-50%, 0); }
      }
    </style>
  </head>

  <body>
    <!-- Capa táctil inicial -->
    <div id="pantalla-inicio">
      <h2 style="margin: 0 0 12px 0;">Experiencia Interactiva</h2>
      <p style="margin: 0; max-width: 320px; line-height: 1.5;">
        Presiona el botón para activar la cámara y el sonido, luego apunta al afiche.
      </p>
      <button id="btn-iniciar">Iniciar experiencia</button>
    </div>

    <!-- Botón CTA final que aparece sobre la cámara -->
    <div id="contenedor-cta">
      <a id="btn-marley" href="https://TU-LINK-DE-REGISTRO-AQUI.com" target="_blank">
        Únete al Marley Club aquí
      </a>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- loop="false" para que el video termine y active el evento -->
        <video 
          id="video-avatar" 
          src="./avatar1.mp4" 
          preload="auto" 
          loop="false" 
          crossorigin="anonymous" 
          playsinline 
          webkit-playsinline>
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane 
          src="#video-avatar" 
          chromakey="color: #04f404; similarity: 0.75; smoothness: 0.1"
          position="0 0 0" 
          height="1.2" 
          width="0.68">
        </a-plane>
      </a-entity>
    </a-scene>

    <script>
      const pantallaInicio = document.querySelector('#pantalla-inicio');
      const btnIniciar = document.querySelector('#btn-iniciar');
      const video = document.querySelector('#video-avatar');
      const target = document.querySelector('[mindar-image-target]');
      const contenedorCTA = document.querySelector('#contenedor-cta');

      // 1. Desbloquear audio con el toque
      btnIniciar.addEventListener('click', () => {
        pantallaInicio.style.display = 'none';
        video.play();
        video.pause();
      });

      // 2. Controlar reproducción según si la cámara enfoca el afiche
      target.addEventListener('targetFound', () => {
        // Solo reproduce si no ha terminado ya el video
        if (!video.ended) {
          video.play();
        }
      });

      target.addEventListener('targetLost', () => {
        if (!video.ended) {
          video.pause();
        }
      });

      // 3. Detectar el momento exacto en que el video termina
      video.addEventListener('ended', () => {
        contenedorCTA.style.display = 'block'; // Muestra el botón emergente
      });
    </script>
  </body>
</html>
