<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Experiencia AR</title>
    <!-- Librerías de realidad aumentada -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <script>
      AFRAME.registerComponent('croma-ligero', {
        schema: {
          src: { type: 'selector' }
        },
        init: function () {
          const video = this.data.src;
          const texture = new THREE.VideoTexture(video);
          texture.minFilter = THREE.LinearFilter;
          texture.magFilter = THREE.LinearFilter;
          texture.format = THREE.RGBAFormat;

          const material = new THREE.ShaderMaterial({
            uniforms: {
              uTexture: { value: texture }
            },
            vertexShader: `
              varying vec2 vUv;
              void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }
            `,
            fragmentShader: `
              uniform sampler2D uTexture;
              varying vec2 vUv;

              void main() {
                vec4 pixel = texture2D(uTexture, vUv);

                // Regla estricta para #04F404:
                // El verde supera claramente a rojo y azul
                float maxOtros = max(pixel.r, pixel.b);
                float diferencia = pixel.g - maxOtros;

                if (diferencia > 0.15 && pixel.g > 0.4) {
                  discard; // Elimina el fondo verde por completo
                } else {
                  gl_FragColor = pixel; // Mantiene el resto intacto
                }
              }
            `,
            transparent: true,
            side: THREE.DoubleSide
          });

          const aplicar = () => {
            const mesh = this.el.getObject3D('mesh');
            if (mesh) {
              mesh.material = material;
            }
          };

          if (this.el.getObject3D('mesh')) {
            aplicar();
          } else {
            this.el.addEventListener('loaded', aplicar);
          }
        }
      });
    </script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #pantalla-inicio {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.88);
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      #btn-iniciar {
        margin-top: 24px;
        padding: 16px 36px;
        font-size: 18px;
        font-weight: bold;
        background-color: #00e676;
        color: #000000;
        border: none;
        border-radius: 50px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div id="pantalla-inicio">
      <h2 style="margin: 0 0 12px 0;">Experiencia Interactiva</h2>
      <p style="margin: 0; max-width: 320px; line-height: 1.5;">
        Presiona el botón para activar la cámara y el sonido, luego apunta al afiche.
      </p>
      <button id="btn-iniciar">Iniciar experiencia</button>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights, alpha: true" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video 
          id="video-avatar" 
          src="./avatar1.mp4" 
          preload="auto" 
          loop="true" 
          playsinline 
          webkit-playsinline>
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane 
          position="0 0 0" 
          height="1.2" 
          width="0.68" 
          croma-ligero="src: #video-avatar;">
        </a-plane>
      </a-entity>
    </a-scene>

    <script>
      const pantallaInicio = document.querySelector('#pantalla-inicio');
      const btnIniciar = document.querySelector('#btn-iniciar');
      const video = document.querySelector('#video-avatar');
      const target = document.querySelector('[mindar-image-target]');

      btnIniciar.addEventListener('click', () => {
        pantallaInicio.style.display = 'none';
        video.play();
        video.pause();
      });

      target.addEventListener('targetFound', () => {
        video.play();
      });

      target.addEventListener('targetLost', () => {
        video.pause();
      });
    </script>
  </body>
</html>
