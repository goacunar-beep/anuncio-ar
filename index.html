<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Experiencia AR</title>
    <!-- Librerías de realidad aumentada -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #pantalla-inicio {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.88);
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      #btn-iniciar {
        margin-top: 24px;
        padding: 16px 36px;
        font-size: 18px;
        font-weight: bold;
        background-color: #00e676;
        color: #000000;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(0, 230, 118, 0.4);
      }
    </style>

    <script>
      // Componente que procesa y transparenta el fondo verde usando Canvas 2D
      AFRAME.registerComponent('croma-canvas', {
        schema: {
          video: { type: 'selector' }
        },
        init: function () {
          this.video = this.data.video;
          this.canvas = document.createElement('canvas');
          this.ctx = this.canvas.getContext('2d', { willReadFrequently: true });
          
          this.texture = new THREE.CanvasTexture(this.canvas);
          this.texture.minFilter = THREE.LinearFilter;
          this.texture.magFilter = THREE.LinearFilter;
          this.texture.format = THREE.RGBAFormat;

          // Material transparente nativo
          this.material = new THREE.MeshBasicMaterial({
            map: this.texture,
            transparent: true,
            side: THREE.DoubleSide
          });

          const aplicar = () => {
            const mesh = this.el.getObject3D('mesh');
            if (mesh) {
              mesh.material = this.material;
            }
          };

          if (this.el.getObject3D('mesh')) {
            aplicar();
          } else {
            this.el.addEventListener('loaded', aplicar);
          }
        },
        tick: function () {
          if (!this.video || this.video.paused || this.video.ended || this.video.readyState < 2) return;

          // Ajustar resolución del lienzo a la del video
          if (this.canvas.width !== this.video.videoWidth && this.video.videoWidth > 0) {
            this.canvas.width = this.video.videoWidth;
            this.canvas.height = this.video.videoHeight;
          }

          if (this.canvas.width === 0) return;

          // Dibujar el fotograma actual
          this.ctx.drawImage(this.video, 0, 0, this.canvas.width, this.canvas.height);
          const frame = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
          const data = frame.data;
          const totalPixeles = data.length;

          // Evaluación directa del verde #04F404 pixel por pixel
          for (let i = 0; i < totalPixeles; i += 4) {
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];

            // Si el verde supera claramente a rojo y azul, se vuelve transparente
            if (g > 110 && (g - r) > 40 && (g - b) > 40) {
              data[i + 3] = 0; // Transparencia total
            }
          }

          // Volver a volcar los datos limpios y actualizar la textura AR
          this.ctx.putImageData(frame, 0, 0);
          this.texture.needsUpdate = true;
        }
      });
    </script>
  </head>

  <body>
    <!-- Pantalla inicial para habilitar audio y cámara -->
    <div id="pantalla-inicio">
      <h2 style="margin: 0 0 12px 0;">Experiencia Interactiva</h2>
      <p style="margin: 0; max-width: 320px; line-height: 1.5;">
        Presiona el botón para activar la cámara y el sonido, luego apunta al afiche.
      </p>
      <button id="btn-iniciar">Iniciar experiencia</button>
    </div>

    <!-- Escena AR -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights, alpha: true" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video 
          id="video-avatar" 
          src="./avatar1.mp4" 
          preload="auto" 
          loop="true" 
          crossorigin="anonymous" 
          playsinline 
          webkit-playsinline>
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Plano que recibe el video sin fondo verde -->
        <a-plane 
          position="0 0 0" 
          height="1.2" 
          width="0.68" 
          croma-canvas="video: #video-avatar;">
        </a-plane>
      </a-entity>
    </a-scene>

    <script>
      const pantallaInicio = document.querySelector('#pantalla-inicio');
      const btnIniciar = document.querySelector('#btn-iniciar');
      const video = document.querySelector('#video-avatar');
      const target = document.querySelector('[mindar-image-target]');

      btnIniciar.addEventListener('click', () => {
        pantallaInicio.style.display = 'none';
        video.play();
        video.pause();
      });

      target.addEventListener('targetFound', () => {
        video.play();
      });

      target.addEventListener('targetLost', () => {
        video.pause();
      });
    </script>
  </body>
</html>
