<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Experiencia AR</title>
    <!-- Librerías base -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <!-- Shader de croma estricto (#04F404) -->
    <script>
      AFRAME.registerComponent('chromakey', {
        init: function () {
          const videoElement = document.querySelector('#video-avatar');
          const texture = new THREE.VideoTexture(videoElement);
          texture.minFilter = THREE.LinearFilter;
          texture.magFilter = THREE.LinearFilter;

          this.material = new THREE.ShaderMaterial({
            uniforms: {
              textureMap: { value: texture }
            },
            vertexShader: `
              varying vec2 vUv;
              void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }
            `,
            fragmentShader: `
              uniform sampler2D textureMap;
              varying vec2 vUv;

              void main() {
                vec4 pixel = texture2D(textureMap, vUv);
                float r = pixel.r;
                float g = pixel.g;
                float b = pixel.b;

                float maxOtros = max(r, b);
                float diferenciaVerde = g - maxOtros;

                // Solo descarta el fondo verde puro #04F404
                if (g > 0.45 && diferenciaVerde > 0.18) {
                  discard;
                } else {
                  if (diferenciaVerde > 0.05) {
                    g = maxOtros;
                  }
                  gl_FragColor = vec4(r, g, b, pixel.a);
                }
              }
            `,
            transparent: true,
            side: THREE.DoubleSide
          });

          const mesh = this.el.getObject3D('mesh');
          if (mesh) {
            mesh.material = this.material;
          } else {
            this.el.addEventListener('loaded', () => {
              this.el.getObject3D('mesh').material = this.material;
            });
          }
        }
      });
    </script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #pantalla-inicio {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.92);
        z-index: 999999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      #btn-iniciar {
        margin-top: 24px;
        padding: 16px 36px;
        font-size: 18px;
        font-weight: bold;
        background-color: #f7b731;
        color: #000000;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(247, 183, 49, 0.4);
      }
      /* Contenedor del Botón Final */
      #contenedor-cta {
        position: fixed !important;
        bottom: 30px !important;
        left: 50% !important;
        transform: translateX(-50%) !important;
        z-index: 2147483647 !important; /* Valor máximo de z-index en navegadores */
        display: none;
        width: 90%;
        max-width: 320px;
        text-align: center;
      }
      #btn-marley-club {
        display: block !important;
        width: 100% !important;
        padding: 18px 24px !important;
        font-size: 17px !important;
        font-weight: 800 !important;
        letter-spacing: 0.5px !important;
        text-transform: uppercase !important;
        background-color: #f7b731 !important;
        color: #111111 !important;
        text-decoration: none !important;
        border-radius: 50px !important;
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.8) !important;
        box-sizing: border-box !important;
      }
    </style>
  </head>

  <body>
    <!-- Pantalla previa obligatoria para desbloqueo de audio -->
    <div id="pantalla-inicio">
      <h2 style="margin: 0 0 12px 0;">Experiencia Interactiva</h2>
      <p style="margin: 0; max-width: 320px; line-height: 1.5;">
        Toca el botón para habilitar la cámara y el audio, luego apunta hacia el afiche.
      </p>
      <button id="btn-iniciar">Iniciar experiencia</button>
    </div>

    <!-- Botón CTA Marley Club que aparece al finalizar -->
    <div id="contenedor-cta">
      <a id="btn-marley-club" href="https://marleycoffee.cl" target="_blank">
        Únete al Marley Club
      </a>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Video sin ningún atributo loop -->
        <video 
          id="video-avatar" 
          src="./avatar1.mp4" 
          preload="auto" 
          crossorigin="anonymous" 
          playsinline 
          webkit-playsinline>
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Escala 1.25 para sobresalir ligeramente del marco del afiche -->
        <a-plane 
          id="plano-avatar"
          chromakey
          position="0 0 0.05" 
          height="1.77" 
          width="1.0"
          scale="1.25 1.25 1.25">
        </a-plane>
      </a-entity>
    </a-scene>

    <script>
      const pantallaInicio = document.querySelector('#pantalla-inicio');
      const btnIniciar = document.querySelector('#btn-iniciar');
      const video = document.querySelector('#video-avatar');
      const target = document.querySelector('[mindar-image-target]');
      const contenedorCta = document.querySelector('#contenedor-cta');

      // 1. Desactivación agresiva del bucle impuesto por A-Frame
      video.removeAttribute('loop');
      video.loop = false;

      let videoFinalizado = false;
      let tiempoPrevio = 0;
      let targetVisible = false;

      function detenerYMostrarCTA() {
        if (videoFinalizado) return;
        videoFinalizado = true;
        
        video.pause();
        // Deja el video fijo en el último fotograma
        if (video.duration && !isNaN(video.duration)) {
          video.currentTime = video.duration - 0.05;
        }

        // Mostrar botón garantizado con estilo inline prioritario
        contenedorCta.style.setProperty('display', 'block', 'important');
      }

      btnIniciar.addEventListener('click', () => {
        pantallaInicio.style.display = 'none';
        video.removeAttribute('loop');
        video.loop = false;
        
        // Calentar el buffer de audio/video
        video.play().then(() => {
          video.pause();
        }).catch(err => console.log(err));
      });

      target.addEventListener('targetFound', () => {
        targetVisible = true;
        if (!videoFinalizado) {
          video.play();
        }
      });

      target.addEventListener('targetLost', () => {
        targetVisible = false;
        if (!videoFinalizado) {
          video.pause();
        }
      });

      // Evento nativo de finalización
      video.addEventListener('ended', () => {
        detenerYMostrarCTA();
      });

      // Loop de verificación por frame para evitar cualquier reinicio automático
      function monitorearProgreso() {
        if (!videoFinalizado) {
          const t = video.currentTime;
          const dur = video.duration;

          // Si el tiempo actual retrocedió tras haber avanzado más de 1s, es porque intentó hacer loop
          if (tiempoPrevio > 1.0 && t < 0.5) {
            detenerYMostrarCTA();
            return;
          }

          // Si está a menos de 0.25 segundos del final con duración conocida
          if (dur && !isNaN(dur) && dur > 0 && t >= dur - 0.25) {
            detenerYMostrarCTA();
            return;
          }

          tiempoPrevio = t;
        }
        requestAnimationFrame(monitorearProgreso);
      }
      requestAnimationFrame(monitorearProgreso);
    </script>
  </body>
</html>
