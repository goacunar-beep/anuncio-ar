<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Experiencia AR</title>
    <!-- Librerías base Three.js / A-Frame / MindAR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <!-- Shader de Chroma Key estricto para verde puro (#04F404) -->
    <script>
      AFRAME.registerComponent('chromakey', {
        init: function () {
          const videoElement = document.querySelector('#video-avatar');
          const texture = new THREE.VideoTexture(videoElement);
          texture.minFilter = THREE.LinearFilter;
          texture.magFilter = THREE.LinearFilter;

          this.material = new THREE.ShaderMaterial({
            uniforms: {
              textureMap: { value: texture }
            },
            vertexShader: `
              varying vec2 vUv;
              void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }
            `,
            fragmentShader: `
              uniform sampler2D textureMap;
              varying vec2 vUv;

              void main() {
                vec4 pixel = texture2D(textureMap, vUv);
                float r = pixel.r;
                float g = pixel.g;
                float b = pixel.b;

                // Aislamiento estricto de verde #04F404:
                // El canal verde debe ser dominante y superar ampliamente a rojo y azul.
                // Esto protege amarillos (R y G altos), blancos (R, G, B altos), piel y sombras.
                float maxOtros = max(r, b);
                float diferenciaVerde = g - maxOtros;

                // Solo descarta el píxel si es verde puro de fondo
                if (g > 0.45 && diferenciaVerde > 0.18) {
                  discard;
                } else {
                  // Corrección de rebote (despill) sutil sin alterar sombras ni bordes legítimos
                  if (diferenciaVerde > 0.05) {
                    g = maxOtros;
                  }
                  gl_FragColor = vec4(r, g, b, pixel.a);
                }
              }
            `,
            transparent: true,
            side: THREE.DoubleSide
          });

          const mesh = this.el.getObject3D('mesh');
          if (mesh) {
            mesh.material = this.material;
          } else {
            this.el.addEventListener('loaded', () => {
              this.el.getObject3D('mesh').material = this.material;
            });
          }
        }
      });
    </script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #pantalla-inicio {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.9);
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      #btn-iniciar {
        margin-top: 24px;
        padding: 16px 36px;
        font-size: 18px;
        font-weight: bold;
        background-color: #f7b731;
        color: #000000;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(247, 183, 49, 0.4);
      }
      /* Contenedor y Botón Marley Club */
      #contenedor-cta {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9998;
        display: none;
        width: 90%;
        max-width: 320px;
        text-align: center;
      }
      #btn-marley-club {
        display: block;
        width: 100%;
        padding: 16px 20px;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        background-color: #f7b731;
        color: #111111;
        text-decoration: none;
        border-radius: 50px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
        box-sizing: border-box;
      }
    </style>
  </head>

  <body>
    <!-- Pantalla obligatoria para desbloqueo de audio context en navegadores móviles -->
    <div id="pantalla-inicio">
      <h2 style="margin: 0 0 12px 0;">Experiencia Interactiva</h2>
      <p style="margin: 0; max-width: 320px; line-height: 1.5;">
        Toca el botón para habilitar la cámara y el audio, luego apunta hacia el afiche.
      </p>
      <button id="btn-iniciar">Iniciar experiencia</button>
    </div>

    <!-- Botón CTA Marley Club que aparece al finalizar el video -->
    <div id="contenedor-cta">
      <a id="btn-marley-club" href="https://marleycoffee.cl" target="_blank" rel="noopener noreferrer">
        Únete al Marley Club
      </a>
    </div>

    <!-- Escena AR anclada al marcador compilado -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video 
          id="video-avatar" 
          src="./avatar1.mp4" 
          preload="auto" 
          loop="false" 
          crossorigin="anonymous" 
          playsinline 
          webkit-playsinline>
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Escala controlada (1.35x): sobresale un poco del marco del afiche sin desbordar en exceso -->
        <!-- position Z en 0.05 para evitar colisión de profundidad (Z-fighting) con la imagen física -->
        <a-plane 
          id="plano-avatar"
          chromakey
          position="0 0.05 0.05" 
          height="1.77" 
          width="1.0"
          scale="1.35 1.35 1.35">
        </a-plane>
      </a-entity>
    </a-scene>

    <script>
      const pantallaInicio = document.querySelector('#pantalla-inicio');
      const btnIniciar = document.querySelector('#btn-iniciar');
      const video = document.querySelector('#video-avatar');
      const target = document.querySelector('[mindar-image-target]');
      const contenedorCta = document.querySelector('#contenedor-cta');
      let videoTerminado = false;

      // 1. Desbloqueo inicial del Media Context
      btnIniciar.addEventListener('click', () => {
        pantallaInicio.style.display = 'none';
        video.play();
        video.pause();
      });

      // 2. Control de reproducción basado en detección del target
      target.addEventListener('targetFound', () => {
        if (!videoTerminado) {
          video.play();
        }
      });

      target.addEventListener('targetLost', () => {
        if (!videoTerminado) {
          video.pause();
        }
      });

      // 3. Evento: al terminar el video, se detiene por completo y se despliega el CTA
      video.addEventListener('ended', () => {
        videoTerminado = true;
        video.pause();
        contenedorCta.style.display = 'block';
      });
    </script>
  </body>
</html>
