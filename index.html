<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Experiencia AR</title>
    <!-- Librerías de realidad aumentada -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #pantalla-inicio {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.88);
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      #btn-iniciar {
        margin-top: 24px;
        padding: 16px 36px;
        font-size: 18px;
        font-weight: bold;
        background-color: #00e676;
        color: #000000;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(0, 230, 118, 0.4);
      }
    </style>
  </head>

  <body>
    <!-- Pantalla previa para desbloquear el audio en navegadores móviles -->
    <div id="pantalla-inicio">
      <h2 style="margin: 0 0 12px 0;">Experiencia Interactiva</h2>
      <p style="margin: 0; max-width: 320px; line-height: 1.5;">
        Presiona el botón para activar la cámara y el sonido, luego apunta al afiche.
      </p>
      <button id="btn-iniciar">Iniciar experiencia</button>
    </div>

    <!-- Escena AR configurada con el archivo targets.mind -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video 
          id="video-avatar" 
          src="./avatar1.mp4" 
          preload="auto" 
          loop="true" 
          crossorigin="anonymous" 
          playsinline 
          webkit-playsinline>
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-video 
          src="#video-avatar" 
          position="0 0 0" 
          height="1.2" 
          width="0.68">
        </a-video>
      </a-entity>
    </a-scene>

    <script>
      const pantallaInicio = document.querySelector('#pantalla-inicio');
      const btnIniciar = document.querySelector('#btn-iniciar');
      const video = document.querySelector('#video-avatar');
      const target = document.querySelector('[mindar-image-target]');

      // Habilitar audio con el toque del usuario
      btnIniciar.addEventListener('click', () => {
        pantallaInicio.style.display = 'none';
        video.play();
        video.pause();
      });

      // Reproducir solo mientras el objetivo esté enfocado
      target.addEventListener('targetFound', () => {
        video.play();
      });

      target.addEventListener('targetLost', () => {
        video.pause();
      });
    </script>
  </body>
</html>
